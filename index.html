<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Irine & Afif</title>
    <!-- Google Fonts untuk Tipografi Elegan -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fdfcfb;
            color: #333333;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Halaman Sampul Depan (Overlay) */
        .cover-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fdfcfb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
            padding: 20px;
            text-align: center;
        }
        .cover-overlay.hide {
            transform: translateY(-100%);
            pointer-events: none;
        }

        /* Container Undangan Utama */
        .invitation-card {
            background-color: #ffffff;
            max-width: 450px;
            width: 100%;
            padding: 60px 35px;
            text-align: center;
            position: relative;
            border: 1px solid #f2eee9;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.015);
            display: none; /* Muncul setelah cover dibuka */
        }

        /* Garis Aksen Emas Minimalis */
        .border-line {
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 20px;
            right: 20px;
            border: 1px solid #c5a059;
            opacity: 0.25;
            pointer-events: none;
        }

        /* Monogram */
        .monogram {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: #c5a059;
            letter-spacing: 4px;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .tagline {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #888888;
            margin-bottom: 15px;
        }

        /* Nama Mempelai */
        .names {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 30px;
            line-height: 1.2;
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: #c5a059;
            margin: 0 auto 30px auto;
            opacity: 0.5;
        }

        /* Detail Waktu & Tempat */
        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #555555;
            margin-top: 25px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            color: #1a1a1a;
            margin-bottom: 5px;
        }

        .time, .venue {
            font-size: 0.85rem;
            color: #666666;
            line-height: 1.6;
            font-weight: 300;
        }

        .venue-name {
            font-size: 0.95rem;
            font-weight: 400;
            color: #1a1a1a;
            margin-top: 5px;
        }

        /* Bagian Kado Digital / Rekening */
        .gift-section {
            margin-top: 40px;
            padding: 20px;
            background-color: #faf8f5;
            border: 1px dashed #e6e0d5;
        }

        .bank-info {
            font-size: 0.85rem;
            color: #555555;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .account-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 500;
            color: #1a1a1a;
            letter-spacing: 1px;
        }

        /* Form RSVP */
        .rsvp-section {
            margin-top: 40px;
            text-align: left;
            border-top: 1px solid #f2eee9;
            padding-top: 30px;
        }

        .rsvp-section .section-title {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555555;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            border: 1px solid #cccccc;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: #1a1a1a;
        }

        /* Tombol - Tombol */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #1a1a1a;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-primary {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: transparent;
            color: #1a1a1a;
        }

        .btn-secondary {
            background-color: transparent;
            color: #555555;
            border: 1px solid #cccccc;
        }

        .btn-secondary:hover {
            border-color: #1a1a1a;
            color: #1a1a1a;
        }

        .btn-sm {
            width: auto;
            padding: 8px 15px;
            font-size: 0.7rem;
            display: inline-block;
            margin-top: 5px;
            border-color: #c5a059;
            color: #c5a059;
            background: transparent;
        }

        .btn-sm:hover {
            background-color: #c5a059;
            color: #ffffff;
        }

        /* Notifikasi Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #333333;
            color: #ffffff;
            padding: 10px 20px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 9999;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Elemen Kontrol Audio Mengambang */
        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #ffffff;
            border: 1px solid #c5a059;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            font-size: 1rem;
        }

        /* Container khusus untuk YouTube Iframe API */
        #player-container {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            bottom: 0;
            left: 0;
            opacity: 0;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .invitation-card { padding: 45px 20px; }
            .names { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- Wadah tersembunyi untuk memuat Video YouTube -->
    <div id="player-container">
        <div id="youtube-player"></div>
    </div>

    <!-- Halaman Sampul Depan -->
    <div class="cover-overlay" id="coverOverlay">
        <div class="monogram">I & A</div>
        <div class="tagline" style="margin-bottom: 5px;">Pernikahan Dari</div>
        <div class="names" style="font-size: 2.5rem; margin-bottom: 40px;">Irine & Afif</div>
        <button class="btn btn-primary" style="max-width: 200px;" onclick="openInvitation()">Buka Undangan</button>
    </div>

    <!-- Konten Undangan Utama -->
    <div class="invitation-card" id="mainInvitation">
        <div class="border-line"></div>
        <div class="monogram">I & A</div>
        <div class="tagline">The Wedding of</div>
        <div class="names">Irine & Afif</div>
        <div class="divider"></div>

        <div class="section-title">Waktu</div>
        <div class="date">Sabtu, 28 November 2026</div>
        <div class="time">
            Akad Nikah: 08.00 WIB <br>
            Resepsi Pernikahan: 10.00 WIB
        </div>

        <div class="section-title">Tempat</div>
        <div class="venue">
            <div class="venue-name">Ballroom Hotel Ramada</div>
        </div>
